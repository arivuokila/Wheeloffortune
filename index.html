<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Fortune</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          animation: {
            'bounce-peg': 'bouncePeg 0.15s ease-in-out',
          },
          keyframes: {
            bouncePeg: {
              '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
              '50%': { transform: 'translateY(-5px) rotate(-14deg)' },
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full w-full bg-[#0f172a] text-slate-100 flex flex-col items-center justify-center overflow-hidden select-none relative m-0 p-0">

  <!-- Main Container -->
  <main class="w-full h-full max-w-4xl max-h-[100vh] p-4 flex flex-col items-center justify-center relative">
    
    <!-- Pointer / Flapper Indicator at 12 o'clock -->
    <div class="relative w-full max-w-[500px] aspect-square flex items-center justify-center">
      
      <div id="pointerContainer" class="absolute -top-4 z-30 left-1/2 -translate-x-1/2 pointer-events-none">
        <div id="flapper" class="w-8 h-11 drop-shadow-[0_4px_12px_rgba(0,0,0,0.7)] origin-top transition-transform duration-75">
          <svg viewBox="0 0 36 48" fill="none" class="w-full h-full">
            <path d="M18 46L3 10C1 5 5 0 11 0H25C31 0 35 5 33 10L18 46Z" fill="url(#pointerGrad)" stroke="#F59E0B" stroke-width="2.5"/>
            <circle cx="18" cy="11" r="5" fill="#FFF" opacity="0.9"/>
            <defs>
              <linearGradient id="pointerGrad" x1="18" y1="0" x2="18" y2="46" gradientUnits="userSpaceOnUse">
                <stop stop-color="#EF4444"/>
                <stop offset="1" stop-color="#B91C1C"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <!-- HTML5 Wheel Canvas -->
      <canvas id="wheelCanvas" class="w-full h-full rounded-full cursor-pointer touch-none drop-shadow-[0_0_40px_rgba(0,0,0,0.6)]"></canvas>

      <!-- Center SPIN Button -->
      <button id="spinBtn" aria-label="Spin the wheel" class="absolute z-20 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-b from-slate-800 via-slate-900 to-slate-950 border-4 border-amber-400/90 shadow-[0_0_30px_rgba(245,158,11,0.5),inset_0_2px_4px_rgba(255,255,255,0.3)] hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center group cursor-pointer focus:outline-none">
        <span id="centerBtnText" class="text-amber-400 font-display font-black text-lg sm:text-xl tracking-wider group-hover:text-amber-300 transition-colors drop-shadow">SPIN</span>
        <span id="centerSubText" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest -mt-0.5">SPACE</span>
      </button>

    </div>

    <!-- Floating Winner Result Card -->
    <div id="winnerCard" class="absolute bottom-6 sm:bottom-10 z-30 opacity-0 translate-y-6 pointer-events-none transition-all duration-400 ease-out flex flex-col items-center">
      <div id="winnerBadge" class="px-6 py-3 rounded-2xl bg-slate-800/90 border border-slate-700/80 shadow-2xl backdrop-blur-md flex items-center space-x-3">
        <span class="text-xl">🏆</span>
        <div class="flex flex-col text-left">
          <span class="text-[10px] uppercase font-bold tracking-widest text-amber-400">Winning Result</span>
          <span id="winnerTitle" class="text-lg sm:text-xl font-display font-black text-white leading-tight">--</span>
        </div>
      </div>
    </div>

  </main>

  <!-- JavaScript Logic & Configuration -->
  <script>
    // =========================================================================
    // ⚙️ IN-CODE CONFIGURATION & SECTORS CUSTOMIZATION
    // =========================================================================
    
    // Physics & General Settings
    const WHEEL_CONFIG = {
      friction: 0.988,         // Deceleration rate (0.980 = fast stop, 0.995 = long spin)
      minInitialSpeed: 0.38,   // Minimum spin strength (radians per frame)
      maxInitialSpeed: 0.58,   // Maximum spin strength (radians per frame)
      centerButtonText: "SPIN",
      centerSubText: "SPACE",  // Subtext under SPIN button
      bezelColor: "#F59E0B",   // Outer rim border color
      pegColor: "#FFFFFF"      // Peg color
    };

    // 8 Sector Definitions: Modify labels, background colors (bg), or text colors (text)
    const SECTORS = [
      { label: "Moodle",       bg: "#EF4444", text: "#FFFFFF" },
      { label: "Howspace",     bg: "#1E293B", text: "#FFFFFF" },
      { label: "Wooclap",      bg: "#F59E0B", text: "#0F172A" },
      { label: "AI",       bg: "#10B981", text: "#FFFFFF" },
      { label: "Thinglink",  bg: "#64748B", text: "#FFFFFF" },
      { label: "Pipari",         bg: "#3B82F6", text: "#FFFFFF" },
      { label: "DIGIPEDAMENTORI",      bg: "#8B5CF6", text: "#FFFFFF" },
      { label: "Pipari",       bg: "#EC4899", text: "#FFFFFF" }
    ];

    // =========================================================================
    // 🌀 WHEEL SYSTEM LOGIC (Do not edit unless changing physics engine)
    // =========================================================================

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const flapper = document.getElementById('flapper');
    const winnerCard = document.getElementById('winnerCard');
    const winnerTitle = document.getElementById('winnerTitle');

    let currentAngle = 0; // Current rotation angle in radians
    let angularVelocity = 0;
    let isSpinning = false;
    let lastPegIndex = -1;

    // Set Up UI Labels from Config
    document.getElementById('centerBtnText').innerText = WHEEL_CONFIG.centerButtonText;
    document.getElementById('centerSubText').innerText = WHEEL_CONFIG.centerSubText;

    // Handle High-DPI Canvas Resizing
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawWheel();
    }

    // Draw Wheel on Canvas
    function drawWheel() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(centerX, centerY) - 18;

      ctx.clearRect(0, 0, width, height);

      const numSectors = SECTORS.length;
      const arc = (Math.PI * 2) / numSectors;

      // Draw Sector Wedges
      for (let i = 0; i < numSectors; i++) {
        const startAngle = currentAngle + i * arc;
        const endAngle = startAngle + arc;
        const sector = SECTORS[i];

        // Slice Path
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();

        // Fill & Stroke
        ctx.fillStyle = sector.bg || '#3B82F6';
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Sector Radial Text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + arc / 2);

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        
        // Responsive Font Size
        const fontSize = Math.max(13, Math.min(20, radius / 11));
        ctx.font = `800 ${fontSize}px 'Outfit', sans-serif`;

        ctx.fillStyle = sector.text || '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 4;

        // Truncate Text if needed
        let text = sector.label || `Sector ${i + 1}`;
        const maxTextWidth = radius - 55;
        if (ctx.measureText(text).width > maxTextWidth) {
          while (text.length > 3 && ctx.measureText(text + '…').width > maxTextWidth) {
            text = text.slice(0, -1);
          }
          text += '…';
        }

        ctx.fillText(text, radius - 28, 0);
        ctx.restore();
      }

      // Draw Outer Bezel Rim
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.strokeStyle = WHEEL_CONFIG.bezelColor;
      ctx.lineWidth = 7;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Decorative Pegs
      for (let i = 0; i < numSectors; i++) {
        const pegAngle = currentAngle + i * arc;
        const pegX = centerX + Math.cos(pegAngle) * radius;
        const pegY = centerY + Math.sin(pegAngle) * radius;

        ctx.beginPath();
        ctx.arc(pegX, pegY, 5, 0, Math.PI * 2);
        ctx.fillStyle = WHEEL_CONFIG.pegColor;
        ctx.fill();
        ctx.strokeStyle = '#D97706';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // Trigger Spin Physics
    function triggerSpin() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;

      // Hide Winner Card when new spin starts
      winnerCard.classList.add('opacity-0', 'translate-y-6', 'pointer-events-none');

      // Set Random Angular Velocity
      const speedRange = WHEEL_CONFIG.maxInitialSpeed - WHEEL_CONFIG.minInitialSpeed;
      angularVelocity = Math.random() * speedRange + WHEEL_CONFIG.minInitialSpeed;
      
      lastPegIndex = -1;
      animateLoop();
    }

    // Animation & Physics Loop
    function animateLoop() {
      if (!isSpinning) return;

      currentAngle += angularVelocity;
      angularVelocity *= WHEEL_CONFIG.friction;

      // Detect Peg Deflection at top pointer (270° / 1.5 * PI)
      const pointerAngle = 1.5 * Math.PI;
      const numSectors = SECTORS.length;
      const arc = (Math.PI * 2) / numSectors;

      const normalizedAngle = (currentAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      let relativeAngle = (pointerAngle - normalizedAngle) % (Math.PI * 2);
      if (relativeAngle < 0) relativeAngle += Math.PI * 2;
      
      const currentSectorIndex = Math.floor(relativeAngle / arc);

      const pegIndex = Math.floor((relativeAngle + arc / 2) / arc) % numSectors;
      if (pegIndex !== lastPegIndex) {
        lastPegIndex = pegIndex;
        triggerPegBounce();
      }

      drawWheel();

      // Check for Wheel Stop
      if (angularVelocity < 0.0015) {
        isSpinning = false;
        angularVelocity = 0;
        spinBtn.disabled = false;
        onSpinComplete(currentSectorIndex);
        return;
      }

      requestAnimationFrame(animateLoop);
    }

    // Flapper Bounce Animation
    function triggerPegBounce() {
      flapper.classList.remove('animate-bounce-peg');
      void flapper.offsetWidth; // Force reflow
      flapper.classList.add('animate-bounce-peg');
    }

    // Show Winning Result Card
    function onSpinComplete(winnerIndex) {
      const winner = SECTORS[winnerIndex];
      winnerTitle.innerText = winner.label;

      winnerCard.classList.remove('opacity-0', 'translate-y-6', 'pointer-events-none');
    }

    // Event Listeners
    window.addEventListener('load', () => {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      spinBtn.addEventListener('click', triggerSpin);
      canvas.addEventListener('click', triggerSpin);

      // Keyboard Controls (Spacebar to spin)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          triggerSpin();
        }
      });
    });
  </script>
</body>
</html>
