<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digipedapyörä</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vh, 24px);
      padding: 16px;
    }

    .headline {
      font-size: clamp(1.75rem, 4.5vw, 2.85rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f8fafc;
      text-align: center;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      line-height: 1.15;
    }

    .wheel-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#wheelCanvas {
      display: block;
      cursor: pointer;
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.55));
    }

    canvas#wheelCanvas.spinning {
      cursor: default;
    }

    .result-banner {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-pill {
      padding: 10px 26px;
      border-radius: 9999px;
      background: rgba(30, 41, 59, 0.92);
      border: 2px solid #38bdf8;
      color: #f8fafc;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      text-align: center;
    }

    .result-pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    canvas#confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="headline">Digipedapyörä</h1>

    <div class="wheel-stage">
      <canvas id="wheelCanvas" aria-label="Digipedapyörä - klikkaa pyörittääksesi"></canvas>
    </div>

    <div class="result-banner" aria-live="polite">
      <div id="resultPill" class="result-pill"></div>
    </div>
  </main>

  <canvas id="confettiCanvas"></canvas>

  <script>
    // =========================================================
    // 1. CUSTOMIZE THE 8 SECTORS HERE
    // =========================================================
    const SECTORS = [
      { label: "Howspace", color: "#ef4444", textColor: "#ffffff" },
      { label: "Moodle", color: "#f97316", textColor: "#ffffff" },
      { label: "Digipeda", color: "#eab308", textColor: "#0f172a" },
      { label: "Wooclap", color: "#22c55e", textColor: "#ffffff" },
      { label: "Thinglink", color: "#06b6d4", textColor: "#0f172a" },
      { label: "Pipari", color: "#3b82f6", textColor: "#ffffff" },
      { label: "AI", color: "#8b5cf6", textColor: "#ffffff" },
      { label: "Pipari", color: "#ec4899", textColor: "#ffffff" }
    ];

    // =========================================================
    // 2. WHEEL SETTINGS
    // =========================================================
    const WHEEL_CONFIG = {
      centerButtonText: "PYÖRÄYTÄ",
      spinDurationMin: 4200, // milliseconds
      spinDurationMax: 6000, // milliseconds
      minRotations: 5,
      maxRotations: 10,
      showConfetti: true
    };

    // =========================================================
    // WHEEL ENGINE (NO EXTERNAL DEPENDENCIES)
    // =========================================================
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const resultPill = document.getElementById("resultPill");
    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiCtx = confettiCanvas.getContext("2d");

    const TWO_PI = Math.PI * 2;
    const POINTER_ANGLE = (3 * Math.PI) / 2; // Top (12 o'clock)
    const sliceAngle = TWO_PI / SECTORS.length;

    let currentAngle = 0;
    let isSpinning = false;
    let spinStartTime = 0;
    let spinDuration = 0;
    let startAngle = 0;
    let targetAngle = 0;
    let lastPegIndex = -1;

    // Flapper spring physics
    let flapperAngle = 0;
    let flapperVelocity = 0;

    // Confetti particles
    let particles = [];

    function resizeCanvases() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const maxSize = Math.min(
        window.innerWidth - 32,
        window.innerHeight - 175,
        540
      );
      const size = Math.max(240, Math.floor(maxSize));

      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      confettiCanvas.width = window.innerWidth * dpr;
      confettiCanvas.height = window.innerHeight * dpr;
      confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawWheel();
    }

    function normalizeAngle(angle) {
      return ((angle % TWO_PI) + TWO_PI) % TWO_PI;
    }

    function getSectorIndexAtPointer(wheelAngle) {
      const relative = normalizeAngle(POINTER_ANGLE - wheelAngle);
      return Math.floor(relative / sliceAngle) % SECTORS.length;
    }

    function drawWheel() {
      const size = parseFloat(canvas.style.width);
      const cx = size / 2;
      const cy = size / 2 + 8; // Slight downward offset to give top pointer room
      const outerRadius = size * 0.45;
      const wheelRadius = outerRadius * 0.92;
      const hubRadius = wheelRadius * 0.21;

      ctx.clearRect(0, 0, size, size);

      // Outer metallic bezel
      const bezelGrad = ctx.createRadialGradient(
        cx, cy, wheelRadius * 0.95,
        cx, cy, outerRadius
      );
      bezelGrad.addColorStop(0, "#1e293b");
      bezelGrad.addColorStop(0.5, "#475569");
      bezelGrad.addColorStop(1, "#0f172a");

      ctx.beginPath();
      ctx.arc(cx, cy, outerRadius, 0, TWO_PI);
      ctx.fillStyle = bezelGrad;
      ctx.fill();

      // Draw sectors
      SECTORS.forEach((sector, i) => {
        const a0 = currentAngle + i * sliceAngle;
        const a1 = a0 + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, wheelRadius, a0, a1);
        ctx.closePath();
        ctx.fillStyle = sector.color;
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.45)";
        ctx.stroke();

        // Sector label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a0 + sliceAngle / 2);

        const textRadius = wheelRadius * 0.62;
        const maxTextWidth = wheelRadius * 0.56;
        let fontSize = Math.max(12, Math.round(wheelRadius * 0.082));
        ctx.font = `700 ${fontSize}px system-ui, -apple-system, sans-serif`;

        while (ctx.measureText(sector.label).width > maxTextWidth && fontSize > 10) {
          fontSize -= 1;
          ctx.font = `700 ${fontSize}px system-ui, -apple-system, sans-serif`;
        }

        ctx.fillStyle = sector.textColor || "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(sector.label, textRadius, 0, maxTextWidth);
        ctx.restore();
      });

      // Subtle inner shadow ring on wheel
      const innerShadow = ctx.createRadialGradient(
        cx, cy, wheelRadius * 0.82,
        cx, cy, wheelRadius
      );
      innerShadow.addColorStop(0, "rgba(0,0,0,0)");
      innerShadow.addColorStop(1, "rgba(0,0,0,0.22)");
      ctx.beginPath();
      ctx.arc(cx, cy, wheelRadius, 0, TWO_PI);
      ctx.fillStyle = innerShadow;
      ctx.fill();

      // Rim pegs at sector boundaries
      const pegRadius = Math.max(3.5, outerRadius * 0.022);
      const pegOrbit = (wheelRadius + outerRadius) / 2;

      for (let i = 0; i < SECTORS.length; i++) {
        const pegAngle = currentAngle + i * sliceAngle;
        const px = cx + Math.cos(pegAngle) * pegOrbit;
        const py = cy + Math.sin(pegAngle) * pegOrbit;

        ctx.beginPath();
        ctx.arc(px, py, pegRadius, 0, TWO_PI);
        ctx.fillStyle = "#e2e8f0";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();
      }

      // Center SPIN hub
      const hubGrad = ctx.createLinearGradient(
        cx - hubRadius, cy - hubRadius,
        cx + hubRadius, cy + hubRadius
      );
      hubGrad.addColorStop(0, "#1e293b");
      hubGrad.addColorStop(1, "#0f172a");

      ctx.beginPath();
      ctx.arc(cx, cy, hubRadius, 0, TWO_PI);
      ctx.fillStyle = hubGrad;
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "#f8fafc";
      ctx.stroke();

      const btnFontSize = Math.max(10, Math.round(hubRadius * 0.25));
      ctx.font = `800 ${btnFontSize}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = isSpinning ? "#94a3b8" : "#f8fafc";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(WHEEL_CONFIG.centerButtonText, cx, cy, hubRadius * 1.7);

      // Top spring-loaded pointer / flapper
      drawPointer(cx, cy - outerRadius - 4, outerRadius);
    }

    function drawPointer(pivotX, pivotY, outerRadius) {
      const pointerLength = Math.max(26, outerRadius * 0.17);
      const pointerWidth = Math.max(18, outerRadius * 0.11);

      ctx.save();
      ctx.translate(pivotX, pivotY);
      ctx.rotate(flapperAngle);

      ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;

      ctx.beginPath();
      ctx.moveTo(-pointerWidth / 2, 0);
      ctx.lineTo(pointerWidth / 2, 0);
      ctx.lineTo(0, pointerLength);
      ctx.closePath();

      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0f172a";
      ctx.stroke();

      // Pivot cap
      ctx.beginPath();
      ctx.arc(0, 2, pointerWidth * 0.28, 0, TWO_PI);
      ctx.fillStyle = "#38bdf8";
      ctx.fill();

      ctx.restore();
    }

    // Quintic ease-out for natural deceleration
    function easeOutQuint(t) {
      return 1 - Math.pow(1 - t, 5);
    }

    function triggerSpin() {
      if (isSpinning) return;

      isSpinning = true;
      canvas.classList.add("spinning");
      resultPill.classList.remove("visible");

      const rotations =
        WHEEL_CONFIG.minRotations +
        Math.random() * (WHEEL_CONFIG.maxRotations - WHEEL_CONFIG.minRotations);
      const extraOffset = Math.random() * TWO_PI;

      startAngle = normalizeAngle(currentAngle);
      targetAngle = startAngle + rotations * TWO_PI + extraOffset;
      spinDuration =
        WHEEL_CONFIG.spinDurationMin +
        Math.random() * (WHEEL_CONFIG.spinDurationMax - WHEEL_CONFIG.spinDurationMin);
      spinStartTime = performance.now();
      lastPegIndex = getSectorIndexAtPointer(startAngle);
    }

    function spawnConfetti() {
      if (!WHEEL_CONFIG.showConfetti) return;
      const colors = SECTORS.map((s) => s.color);
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.45;

      for (let i = 0; i < 85; i++) {
        const angle = Math.random() * TWO_PI;
        const speed = 4 + Math.random() * 9;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 6 + Math.random() * 6,
          color: colors[i % colors.length],
          rotation: Math.random() * TWO_PI,
          vRot: (Math.random() - 0.5) * 0.25,
          alpha: 1
        });
      }
    }

    function updateConfetti() {
      if (particles.length === 0) return;

      confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28; // Gravity
        p.vx *= 0.985;
        p.rotation += p.vRot;
        p.alpha -= 0.012;

        if (p.alpha <= 0 || p.y > window.innerHeight + 20) {
          particles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rotation);
        confettiCtx.globalAlpha = Math.max(0, p.alpha);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        confettiCtx.restore();
      }
    }

    function animate(now) {
      if (isSpinning) {
        const elapsed = now - spinStartTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const eased = easeOutQuint(progress);

        currentAngle = startAngle + (targetAngle - startAngle) * eased;

        // Detect peg crossings to flick the flapper
        const currentPegIndex = getSectorIndexAtPointer(currentAngle);
        if (currentPegIndex !== lastPegIndex) {
          flapperVelocity = -0.32;
          lastPegIndex = currentPegIndex;
        }

        if (progress >= 1) {
          isSpinning = false;
          canvas.classList.remove("spinning");
          currentAngle = normalizeAngle(targetAngle);

          const winner = SECTORS[getSectorIndexAtPointer(currentAngle)];
          resultPill.textContent = winner.label;
          resultPill.style.borderColor = winner.color;
          resultPill.classList.add("visible");
          spawnConfetti();
        }
      }

      // Spring-damper restoration for top flapper
      const springForce = -0.22 * flapperAngle;
      flapperVelocity = (flapperVelocity + springForce) * 0.8;
      flapperAngle += flapperVelocity;

      drawWheel();
      updateConfetti();
      requestAnimationFrame(animate);
    }

    // Event listeners
    canvas.addEventListener("click", triggerSpin);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        triggerSpin();
      }
    });
    window.addEventListener("resize", resizeCanvases);

    // Initialize
    resizeCanvases();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
